<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Информация об игре</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <header>
        <h1>Информация об игре</h1>
    </header>

    <div id="gameContainer">
        <img id="gameImage" src="" alt="Обложка игры" />
        <h2 id="gameName"></h2>
        <p><strong>Описание:</strong> <span id="gameDescription"></span></p>
        <p><strong>Жанр:</strong> <span id="gameGenre"></span></p>
        <p><strong>Автор:</strong> <span id="gameAuthor"></span></p>

        <button onclick="showUpdateForm()">Обновить</button>
        <button onclick="deleteGame()">Удалить</button>
    </div>

    <div id="updateForm" style="display:none;">
        <h2>Редактировать игру</h2>
        <label>Название:</label>
        <input type="text" id="updateName" />
        <label>Жанр:</label>
        <input type="text" id="updateGenre" />
        <label>Автор:</label>
        <input type="text" id="updateAuthor" />
        <label>Описание:</label>
        <textarea id="updateDescription"></textarea>
        <label>Изображение:</label>
        <input type="file" id="updateImage" accept="image/*" />

        <button onclick="updateGame()">Сохранить</button>
    </div>

    <script>
        const gameId = new URLSearchParams(window.location.search).get("id");

        async function loadGame() {
            const response = await fetch(`/api/game/${gameId}`);
            if (!response.ok) {
                alert("Игра не найдена");
                window.location.href = "/";
                return;
            }

            const game = await response.json();
            document.getElementById("gameImage").src = `/${game.imagePath}`;
            document.getElementById("gameName").textContent = game.name;
            document.getElementById("gameDescription").textContent = game.description || "Нет описания.";
            document.getElementById("gameGenre").textContent = game.genre;
            document.getElementById("gameAuthor").textContent = game.author;

            document.getElementById("updateName").value = game.name;
            document.getElementById("updateGenre").value = game.genre;
            document.getElementById("updateAuthor").value = game.author;
            document.getElementById("updateDescription").value = game.description;
        }

        function showUpdateForm() {
            document.getElementById("updateForm").style.display = "block";
        }

        async function updateGame() {
            const formData = new FormData();
            formData.append("name", document.getElementById("updateName").value);
            formData.append("genre", document.getElementById("updateGenre").value);
            formData.append("author", document.getElementById("updateAuthor").value);
            formData.append("description", document.getElementById("updateDescription").value);

            const imageFile = document.getElementById("updateImage").files[0];
            if (imageFile) {
                formData.append("image", imageFile);
            }

            const response = await fetch(`/api/game/${gameId}/update`, {
                method: "PUT",
                body: formData
            });

            if (response.ok) {
                alert("Игра обновлена!");
                loadGame();
            } else {
                alert("Ошибка при обновлении.");
            }
        }

        async function deleteGame() {
            if (!confirm("Вы уверены, что хотите удалить игру?")) return;

            const response = await fetch(`/api/game/${gameId}/delete`, {
                method: "DELETE"
            });

            if (response.ok) {
                alert("Игра удалена!");
                window.location.href = "/";
            } else {
                alert("Ошибка при удалении.");
            }
        }

        loadGame();
    </script>
</body>
</html>
